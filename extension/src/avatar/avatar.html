<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>NeoTalk avatar</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; overflow: hidden; }
      #widget { display: block; width: 100%; height: 100%; border: 0; }
      #fallback {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        margin: 0; padding: 14px; box-sizing: border-box;
        color: #e2e8f0; background: #0f172a; text-align: center;
        font: 13px Arial, Helvetica, sans-serif;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <iframe id="widget" title="Avatar 3D NeoTalk" allow="autoplay" hidden></iframe>
    <p id="fallback">Preparando avatar...</p>
    <script type="module" src="../../dist/avatar/avatar.js"></script>
  </body>
</html>
